name: Build GptFit Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest runner already includes Android SDK.
      # Avoid setup-android here: its sdkmanager bootstrap currently
      # attempts to install the obsolete "tools" package and can fail.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: GptFit_Android_Web_Source_1.1.0/GptFit
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GptFit-debug-apk
          path: GptFit_Android_Web_Source_1.1.0/GptFit/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
